name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to Maven Central (otherwise build and smoke-test only)
        type: boolean
        default: false
      auto-publish:
        description: Publish without the manual step in the Central Portal
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Check the release tag matches the version
        if: github.event_name == 'release'
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: bash scripts/fetch-natives.sh natives
      - run: mvn -B -ntp -Prelease -Dgpg.skip verify
      - run: mvn -B -ntp -q dependency:copy-dependencies -DincludeScope=runtime -DexcludeArtifactIds=json -DoutputDirectory=target/deps
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: |
            target/edifabric-x12-native-*.jar
            target/deps/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: natives
          path: natives
          if-no-files-found: error

  smoke-test:
    needs: build
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: artifact
      - name: Load the bundled library from a folder without one
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          cp artifact/edifabric-x12-native-*.jar artifact/deps/*.jar scripts/SmokeTest.java "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          rm -f edifabric-x12-native-*-sources.jar edifabric-x12-native-*-javadoc.jar
          sep=$([ "$RUNNER_OS" = Windows ] && echo ';' || echo ':')
          java -cp "$(ls *.jar | paste -sd "$sep")" SmokeTest.java

  publish:
    needs: smoke-test
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: natives
          path: natives
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - run: mvn -B -ntp -Prelease -Dcentral.autoPublish=${{ github.event_name == 'release' || inputs.auto-publish }} deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
